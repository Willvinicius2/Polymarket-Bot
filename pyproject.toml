[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-bot"
version = "0.1.0"
description = "Autonomous latency monitor and execution engine for Polymarket crypto markets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "py-clob-client>=0.34.6,<1",
  "python-dotenv>=1.0,<2",
  "rich>=13.9,<15",
  "websockets>=12,<16",
]

[project.scripts]
polybot = "polybot.app:main"

[tool.setuptools]
packages = [
  "polybot",
  "polybot.clients",
  "polybot.strategies",
]
